services:
  # ===========================================================================
  # AI Service (FastAPI) — Internal only, NOT exposed to the host.
  # This is the core estimation service. It is reachable only from within the
  # Docker network by other services (streamlit, future business-backend).
  # ===========================================================================
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sw-estimator:latest
    # NO "ports:" — internal only, not reachable from the host.
    # This is the key security property: the AI service cannot be accessed
    # directly from outside the Docker network.
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://estimator:estimator@postgres:5432/estimator
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ===========================================================================
  # Streamlit Frontend — Public entry point.
  # This is the ONLY service exposed to the host (besides the databases for
  # development convenience). Users interact with the system through this UI.
  # ===========================================================================
  streamlit:
    image: sw-estimator:latest
    command: ["python", "-m", "streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"  # Public entry point — users access the UI here
    env_file:
      - .env
    environment:
      # Streamlit reaches the AI service via internal Docker DNS
      - ESTIMATOR_API_URL=http://ai-service:8000
      - SERVICE_TOKEN=${SERVICE_TOKEN}
    restart: unless-stopped
    depends_on:
      - ai-service

  # ===========================================================================
  # Redis Stack — Semantic cache + vector search (RediSearch).
  # Exposed on host:6380 for development convenience (inspect with redis-cli).
  # ===========================================================================
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # PostgreSQL + pgvector — Persistence layer.
  # Exposed on host:5432 for development (run migrations, inspect data).
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: estimator
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  postgres_data:
