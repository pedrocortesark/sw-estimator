services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime # Use the runtime stage (not the builder)

    image: sw-estimator:latest

    ports:
      - "8000:8000" # host_port:container_port

    # Load environment variables from .env file.
    # The .env file is NEVER copied into the image (see .dockerignore).
    # It is only read at runtime by docker compose on the host machine.
    env_file:
      - .env

    # Override specific env vars for the containerised environment.
    # APP_ENV=production hides /docs and /redoc endpoints.
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://estimator:estimator@postgres:5432/estimator

    # Restart policy: restart the container automatically if it crashes.
    # "unless-stopped" means it restarts on failure but not if you stop it manually.
    restart: unless-stopped
    # docker compose respects the HEALTHCHECK defined in the Dockerfile.
    # You can check status with: docker compose ps
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  streamlit:
    image: sw-estimator:latest # same image, different command
    command: [ "streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true" ]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - ESTIMATOR_API_URL=http://api:8000 # internal docker network
    restart: unless-stopped
    depends_on:
      - api

  blazor:
    build:
      context: ./frontend/SwEstimator.Client
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - api

  # Redis Stack includes RediSearch, which provides the FT.CREATE / FT.SEARCH
  # commands required by the semantic cache's vector index.
  # Vanilla redis:alpine does NOT include RediSearch and will fail with
  # "ERR unknown command 'FT.CREATE'" when EstimationSemanticCache.create() runs.
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6380:6379" # Redis Stack on host:6380 (6379 is taken by another Redis)
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Postgres with pgvector (Session 8). The pgvector/pgvector:pg16 image
  # ships the extension compiled — a single ``CREATE EXTENSION vector`` is
  # enough. 5432 on the host (no collision here, unlike the antonio-project
  # monorepo setup).
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: estimator
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  postgres_data:
