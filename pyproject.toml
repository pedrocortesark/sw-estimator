[project]
name = "sw-estimator"
version = "0.1.0"
description = "API REST que estima el esfuerzo de software a partir de transcripciones de reuniones usando LLMs (CAG)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "faker>=37.0",
    "fakeredis>=2.35.1",
    "fastapi>=0.136.1",
    "fpdf2>=2.8.7",
    "httpx>=0.28.1",
    "instructor>=1.15.1",
    "jinja2>=3.1",
    "litellm>=1.83.0",
    "numpy>=1.26",
    "openai>=2.33.0",
    "pandera[pandas]>=0.23",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.0",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.27",
    "redis>=7.4.0",
    "redisvl>=0.3",
    "sqlalchemy>=2.0",
    "streamlit>=1.57.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.46.0",
    # Session 8 — pgvector persistence (async driver + vector type for SQLAlchemy + migrations)
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",  # sync driver for Alembic
    "greenlet>=3.0.3",  # SQLAlchemy 2.0 + asyncpg requires it at runtime
    # Session 7 — embedding pipeline (tiktoken for token counting; openai already above)
    "tiktoken>=0.7.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "deepeval>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
# Run all async tests automatically without needing @pytest.mark.asyncio on each one.
# "auto" mode: any async test function is treated as an asyncio coroutine.
asyncio_mode = "auto"
# Only look for tests inside the tests/ directory
testpaths = ["tests"]
markers = [
    "golden: marks tests that call a live LLM to evaluate the golden dataset (deselect with -m 'not golden')",
    "hard: Family 1 — structural and numerical assertions on LLM output (live LLM, fast per test)",
    "soft: Family 2 — statistical consistency tests; N_RUNS calls per case (live LLM, slow)",
    "judge: Family 3 — LLM-as-judge quality evaluation via DeepEval GEval (live LLM + judge call)",
]
