[project]
name = "sw-estimator"
version = "0.1.0"
description = "API REST que estima el esfuerzo de software a partir de transcripciones de reuniones usando LLMs (CAG)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "fastapi>=0.136.1",
    "litellm>=1.83.0",
    "loguru>=0.7.3",
    "openai>=2.33.0",
    "pydantic-settings>=2.14.0",
    "streamlit>=1.57.0",
    "uvicorn[standard]>=0.46.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
# Run all async tests automatically without needing @pytest.mark.asyncio on each one.
# "auto" mode: any async test function is treated as an asyncio coroutine.
asyncio_mode = "auto"
# Only look for tests inside the tests/ directory
testpaths = ["tests"]
